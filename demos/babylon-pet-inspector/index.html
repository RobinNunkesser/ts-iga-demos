<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Babylon.js 3D-Asset & Animation Inspector — IGA Demos</title>
    <link rel="stylesheet" href="../../src/style.css" />
    <style>
      .asset-info-overlay {
        position: absolute;
        top: 14px;
        left: 14px;
        background: rgba(15, 23, 42, 0.88);
        backdrop-filter: blur(10px);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 0.82rem;
        color: var(--text-muted);
        max-width: 320px;
        z-index: 10;
        line-height: 1.4;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        pointer-events: auto;
        transition: all 0.25s ease;
      }
      .asset-info-overlay strong {
        color: var(--text-main);
      }
      .asset-info-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        cursor: pointer;
        user-select: none;
      }
      .btn-info-toggle {
        background: rgba(56, 189, 248, 0.15);
        color: #38bdf8;
        border: 1px solid rgba(56, 189, 248, 0.3);
        border-radius: 4px;
        padding: 2px 7px;
        font-size: 0.7rem;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        transition: all 0.15s ease;
      }
      .btn-info-toggle:hover {
        background: rgba(56, 189, 248, 0.3);
      }
      .asset-info-body {
        transition: max-height 0.25s ease, opacity 0.2s ease, margin 0.2s ease;
        overflow: hidden;
      }
      .asset-info-overlay.collapsed .asset-info-body {
        max-height: 0;
        opacity: 0;
        margin: 0;
        padding: 0;
        pointer-events: none;
      }
      .asset-info-overlay.collapsed {
        padding: 5px 10px;
        background: rgba(15, 23, 42, 0.72);
        border-color: rgba(56, 189, 248, 0.3);
      }

      .badge-highlight {
        color: #38bdf8;
        font-weight: 600;
      }
      .badge-triangles {
        color: #10b981;
        font-weight: 600;
      }
      .badge-bones {
        color: #f59e0b;
        font-weight: 600;
      }
      .anim-btn-group {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
      }
      .btn-anim.active {
        background: #0284c7 !important;
        border-color: #38bdf8 !important;
        color: #ffffff !important;
        box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
      }
      .btn-wireframe-active {
        background: #059669 !important;
        border-color: #34d399 !important;
        color: #ffffff !important;
        box-shadow: 0 0 10px rgba(52, 211, 153, 0.4);
      }
      .pet-select-dropdown {
        background: rgba(30, 41, 59, 0.95);
        color: var(--text-main);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 12px;
        font-size: 0.85rem;
        font-weight: 500;
        cursor: pointer;
        outline: none;
        transition: border-color 0.15s ease;
      }
      .pet-select-dropdown:hover,
      .pet-select-dropdown:focus {
        border-color: var(--accent-cyan);
      }

      /* Smartphone-Optimierung */
      @media (max-width: 640px), (max-height: 640px) {
        .asset-info-overlay {
          top: 8px;
          left: 8px;
          max-width: calc(100% - 16px);
          font-size: 0.76rem;
        }
        .controls-bar {
          padding: 6px 8px !important;
          gap: 6px !important;
        }
        .anim-btn-group {
          flex-wrap: nowrap !important;
          overflow-x: auto !important;
          -webkit-overflow-scrolling: touch;
          padding-bottom: 4px;
          width: 100%;
        }
        .btn-action {
          padding: 5px 9px !important;
          font-size: 0.76rem !important;
          white-space: nowrap;
        }
        .pet-select-dropdown {
          padding: 4px 8px !important;
          font-size: 0.78rem !important;
          max-width: 170px;
        }
        .metric-badge {
          display: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <div class="title-group">
          <h1>Babylon.js: 3D-Asset & Animation Inspector</h1>
          <p>Kenney Cube-Pets: Geometrie, glTF-Skelettanimation & Wireframe-Topologie</p>
        </div>
        <nav class="nav-links">
          <a class="nav-btn" href="../../index.html">← Hub</a>
          <a class="nav-btn" href="../babylon-basics/index.html">Basics</a>
          <a class="nav-btn" href="../babylon-actions-gui/index.html">GUI</a>
          <a class="nav-btn" href="../babylon-physics/index.html">Havok</a>
          <a class="nav-btn" href="../babylon-models/index.html">Wald-Szene</a>
          <a class="nav-btn active" href="#">Model Inspector</a>
        </nav>
      </header>

      <main id="canvas-container" style="position: relative;">
        <canvas id="renderCanvas" style="width: 100%; height: 100%; touch-action: none;"></canvas>
        <div class="asset-info-overlay" id="asset-inspector">
          <div class="asset-info-header" id="info-header" title="Klicken, um Details ein-/auszublenden">
            <div style="display: flex; align-items: center; gap: 6px;">
              <strong id="info-pet-title" class="badge-highlight">🐶 Hund</strong>
              <span id="info-pet-filename" style="font-size: 0.72rem; opacity: 0.8;">(animal-dog.glb)</span>
            </div>
            <button class="btn-info-toggle" id="btn-toggle-info" type="button" aria-label="Details ein-/ausblenden">
              <span id="toggle-info-label">Info</span>
              <span id="toggle-info-icon" style="font-size: 0.7rem;">▲</span>
            </button>
          </div>
          <div class="asset-info-body" id="info-body">
            <div style="margin-top: 6px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; font-size: 0.76rem;">
              <div>Triangles: <span id="info-triangles" class="badge-triangles">-</span></div>
              <div>Vertices: <span id="info-vertices">-</span></div>
              <div>Bones: <span id="info-bones" class="badge-bones">-</span></div>
              <div>Clips: <span id="info-anim-count">-</span></div>
            </div>
            <div id="info-current-anim" style="margin-top: 6px; font-size: 0.74rem; color: #cbd5e1; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 4px;">
              Aktiv: <strong style="color: #38bdf8;">walk</strong>
            </div>
          </div>
        </div>
      </main>

      <div class="controls-bar" style="flex-direction: column; gap: 8px;">
        <!-- Zeile 1: Modellauswahl & Darstellungsmodi -->
        <div style="display: flex; gap: 8px; align-items: center; justify-content: space-between; width: 100%; flex-wrap: wrap;">
          <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
            <label for="pet-select" style="font-size: 0.82rem; color: var(--text-muted); font-weight: 500;">Tier auswählen:</label>
            <select id="pet-select" class="pet-select-dropdown">
              <!-- Dynamisch oder statisch befüllt mit allen 24 Tieren -->
            </select>
          </div>

          <div style="display: flex; gap: 6px; align-items: center; flex-wrap: wrap;">
            <button class="btn-action" id="btn-wireframe" title="Zwischen PBR-Textur und Drahtgitter (Wireframe) umschalten">🌐 Wireframe: AUS</button>
            <button class="btn-action" id="btn-autorotate" title="Automatische Drehung umschalten">🔄 Auto-Rotate: AN</button>
            <button class="btn-action" id="btn-reset-cam" title="Kamera auf Standardperspektive zurücksetzen">🎯 Reset Cam</button>
            <div class="metric-badge" id="metric-status">Status: Initialisiere...</div>
          </div>
        </div>

        <!-- Zeile 2: Animationen durchschalten -->
        <div style="display: flex; gap: 8px; align-items: center; width: 100%; flex-wrap: wrap;">
          <span style="font-size: 0.82rem; color: var(--text-muted); font-weight: 500;">Animation:</span>
          <div class="anim-btn-group" id="anim-buttons">
            <!-- Dynamisch generiert basierend auf den AnimationGroups des geladenen GLB -->
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="../../src/babylon-pet-inspector.ts"></script>
  </body>
</html>
