<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Babylon.js Havok Physics V2 — IGA Demos</title>
    <link rel="stylesheet" href="../../src/style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <div class="title-group">
          <h1>Babylon.js: Integrierte Physik mit Havok V2</h1>
          <p>Gravitation, Kollisionen und Rückprall mit PhysicsAggregate</p>
        </div>
        <nav class="nav-links">
          <a class="nav-btn" href="../../index.html">← Hub</a>
          <a class="nav-btn" href="../babylon-basics/index.html">Babylon Basics</a>
          <a class="nav-btn" href="../babylon-actions-gui/index.html">Babylon GUI & Actions</a>
          <a class="nav-btn active" href="#">Havok Physik</a>
        </nav>
      </header>

      <main id="canvas-container">
        <canvas id="renderCanvas" style="width: 100%; height: 100%; touch-action: none;"></canvas>
      </main>

      <div class="controls-bar">
        <button class="btn-action" id="btn-spawn" disabled>⚽ Kugel fallen lassen</button>
        <button class="btn-action" id="btn-reset" disabled style="background: rgba(30,41,59,0.8); border: 1px solid var(--border);">Zurücksetzen</button>
        <label class="control-item" for="restitution">
          <span>Rückprall:</span>
          <input type="range" id="restitution" min="0" max="1" step="0.05" value="0.8" style="width: 90px;" disabled />
          <output id="restitution-value">0.80</output>
        </label>
        <div class="metric-badge" id="metric-info" role="status" aria-live="polite">Havok wird geladen …</div>
      </div>
    </div>
    <script type="module" src="../../src/babylon-physics.ts"></script>
  </body>
</html>
